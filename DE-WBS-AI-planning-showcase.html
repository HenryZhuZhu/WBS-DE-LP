<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light">
  <title>DE-WBS · AI 规划视觉方案集</title>
  <style>
    :root {
      --blue: #0052d9;
      --blue-dark: #003b9d;
      --navy: #102447;
      --ink: #14243d;
      --muted: #60718a;
      --line: #dce5f0;
      --soft: #eef4ff;
      --paper: #fff;
      --green: #087a62;
      --green-soft: #eef8f4;
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body { margin: 0; background: #eef2f7; color: var(--ink); font: 14px/1.65 var(--font); }
    button { font: inherit; cursor: pointer; }
    button:focus-visible, a:focus-visible, [tabindex="0"]:focus-visible { outline: 3px solid #6aa0ff; outline-offset: 4px; }
    h1, h2, h3, h4, p { margin: 0; }
    h1, h2, h3, h4 { line-height: 1.4; }
    svg { display: block; }
    .icon { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.65; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
    .shell { max-width: 1400px; margin: 0 auto; padding: 26px 32px 32px; }
    .masthead { display: flex; align-items: center; justify-content: space-between; gap: 20px; margin-bottom: 26px; }
    .brand { display: flex; align-items: center; gap: 11px; }
    .brand-mark { display: grid; place-items: center; background: var(--blue); color: white; width: 36px; height: 36px; border-radius: 10px; }
    .brand-name { font-weight: 760; font-size: 16px; letter-spacing: .4px; }
    .brand-note { color: var(--muted); font-size: 11px; letter-spacing: 1.2px; }
    .masthead-right { display: flex; align-items: center; gap: 16px; }
    .planning-label { display: inline-flex; align-items: center; gap: 7px; font-size: 12px; color: var(--muted); }
    .planning-label::before { content: ""; width: 6px; height: 6px; background: #71839e; border-radius: 50%; }
    .quiet-button { border: 1px solid #cbd6e5; border-radius: 7px; padding: 7px 12px; background: transparent; color: #43566f; display: inline-flex; align-items: center; gap: 8px; }
    .quiet-button:hover { background: white; border-color: #91afd7; color: var(--blue); }
    .quiet-button .icon { width: 16px; height: 16px; }
    .intro { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; margin-bottom: 22px; }
    .intro h1 { font-size: clamp(24px, 2.6vw, 33px); font-weight: 760; letter-spacing: -.8px; }
    .intro p { margin-top: 6px; color: var(--muted); }
    .edition { color: #77869b; font-size: 11px; letter-spacing: 1.5px; white-space: nowrap; }
    .scheme-tabs { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 9px; }
    .scheme-tab { position: relative; min-width: 0; text-align: left; padding: 15px 13px 12px; color: var(--muted); border: 1px solid #d7e0ec; background: #f8fafc; border-radius: 9px; transition: border-color .16s, background .16s; }
    .scheme-tab:hover { border-color: #97b9e8; background: #fff; }
    .scheme-tab[aria-selected="true"] { border-color: var(--blue); background: white; color: var(--blue); box-shadow: 0 0 0 1px var(--blue); }
    .tab-meta { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
    .tab-number { font: 600 12px/1.3 var(--font); letter-spacing: 1px; }
    .tab-meta .icon { width: 21px; height: 21px; opacity: .85; }
    .scheme-tab strong { display: block; font-size: 14px; color: var(--ink); }
    .scheme-tab[aria-selected="true"] strong { color: var(--blue); }
    .scheme-tab small { font-size: 11px; }
    .recommend-badge { position: absolute; right: 8px; top: -9px; background: var(--blue); color: white; border: 2px solid #eef2f7; border-radius: 5px; padding: 0 6px; font-size: 10px; line-height: 19px; }
    .scheme-context { display: flex; justify-content: space-between; align-items: center; gap: 20px; padding: 16px 0; color: var(--muted); font-size: 12px; }
    .context-use { display: flex; gap: 9px; align-items: center; }
    .context-use strong { color: #344967; font-weight: 600; }
    .context-count { white-space: nowrap; letter-spacing: 1px; color: var(--blue); }
    .presentation { border: 1px solid #d9e2ee; border-radius: 13px; background: white; box-shadow: 0 14px 42px -25px #254b8155; overflow: hidden; }
    .sheet { padding: 36px 40px 24px; }
    .eyebrow { display: flex; align-items: center; gap: 9px; color: var(--blue); font-size: 10px; font-weight: 750; letter-spacing: 2px; text-transform: uppercase; }
    .eyebrow::before { content: ""; width: 18px; height: 2px; background: currentColor; flex-shrink: 0; }
    .sheet-hero { display: flex; justify-content: space-between; align-items: center; gap: 28px; padding-bottom: 25px; }
    .sheet h2 { font-size: clamp(26px, 2.8vw, 38px); letter-spacing: -1px; font-weight: 770; margin-top: 12px; }
    .hero-copy { color: var(--muted); margin-top: 10px; font-size: 14px; max-width: 760px; }
    .scope-stat { display: flex; align-items: center; gap: 18px; flex-shrink: 0; }
    .scope-stat strong { display: block; font-size: 36px; font-weight: 600; line-height: 1.1; color: var(--blue); }
    .scope-stat small { color: var(--muted); font-size: 11px; }
    .scope-stat > span { color: #b5c6dd; font-size: 23px; }
    .section-line { display: flex; gap: 12px; align-items: baseline; margin-bottom: 15px; }
    .section-line h3 { font-size: 17px; }
    .section-line span { font-size: 12px; color: var(--muted); }
    .phase-label { font-size: 10px; font-weight: 700; letter-spacing: 1.3px; color: var(--blue); display: block; margin-bottom: 4px; }
    .feature-grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 11px; }
    .feature-card { position: relative; min-width: 0; border: 1px solid #dce7f7; border-top: 3px solid var(--blue); padding: 20px 16px 16px; border-radius: 7px; background: #f8fbff; }
    .feature-top { display: flex; align-items: center; justify-content: space-between; color: var(--blue); margin-bottom: 18px; }
    .feature-top .feature-index { font-size: 11px; color: #7188a8; font-variant-numeric: tabular-nums; }
    .feature-card h4 { font-size: 15px; margin-bottom: 8px; }
    .feature-card p { font-size: 12px; line-height: 1.8; color: var(--muted); }
    .feature-value { display: inline-block; color: var(--blue); font-size: 11px; padding-top: 14px; font-weight: 600; }
    .bridge { margin: 23px 0; background: var(--soft); border: 1px solid #e2eafb; border-radius: 7px; padding: 13px 20px; display: flex; align-items: center; justify-content: space-between; gap: 18px; }
    .bridge-title { font-size: 12px; color: #456590; }
    .bridge-flow { display: flex; align-items: center; gap: 20px; color: var(--blue); font-weight: 600; }
    .bridge-flow i { font-style: normal; color: #8eaed9; font-weight: 400; }
    .vision-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 13px; }
    .vision-card { border: 1px dashed #bfcee2; background: #fff; border-radius: 7px; padding: 17px 18px; display: flex; gap: 14px; align-items: flex-start; min-width: 0; }
    .vision-card > .icon { color: #6b88b4; width: 23px; height: 23px; margin-top: 2px; }
    .vision-card h4 { font-size: 14px; margin-bottom: 6px; }
    .vision-card p { color: var(--muted); font-size: 12px; line-height: 1.8; }
    .sheet-foot { margin-top: 23px; border-top: 1px solid var(--line); padding-top: 14px; display: flex; align-items: center; justify-content: space-between; gap: 20px; color: #79879b; font-size: 10px; }
    .sheet-foot strong { font-size: 12px; color: #536984; font-weight: 500; }
    .viewer-foot { display: flex; align-items: center; justify-content: space-between; gap: 18px; margin-top: 19px; }
    .viewer-foot p { color: var(--muted); font-size: 12px; }
    .viewer-controls { display: flex; align-items: center; gap: 8px; }
    .viewer-controls button { background: white; border: 1px solid #d3deeb; color: #385579; border-radius: 7px; padding: 7px 13px; white-space: nowrap; }
    .viewer-controls button:hover { border-color: var(--blue); color: var(--blue); }
    .viewer-controls .primary { color: white; background: var(--blue); border-color: var(--blue); }
    .viewer-controls .primary:hover { background: var(--blue-dark); color: white; }
    .roadmap { display: grid; grid-template-columns: 1.15fr .65fr 1fr; gap: 23px; padding-top: 10px; align-items: stretch; }
    .epoch { position: relative; padding-top: 20px; border-top: 2px solid #bfd0e7; }
    .epoch::before { content: ""; position: absolute; width: 10px; height: 10px; border: 4px solid white; box-sizing: content-box; border-radius: 50%; background: #aac0df; left: 0; top: -10px; }
    .epoch.now { border-color: var(--blue); }
    .epoch.now::before { background: var(--blue); }
    .epoch.later { border-top-style: dashed; }
    .epoch h3 { font-size: 24px; margin: 5px 0 6px; }
    .epoch-sub { font-size: 12px; color: var(--muted); min-height: 42px; margin-bottom: 13px; }
    .road-list { display: grid; gap: 9px; }
    .road-item { display: flex; gap: 12px; padding: 13px 14px; border: 1px solid #e1e9f4; background: #f8fbff; border-radius: 6px; }
    .road-item .icon { color: var(--blue); width: 20px; height: 20px; margin-top: 3px; }
    .road-item h4 { font-size: 13px; }
    .road-item p { color: var(--muted); font-size: 11px; margin-top: 3px; }
    .asset-stack { display: grid; align-content: center; gap: 11px; min-height: 350px; background: #f3f6fa; border-radius: 8px; padding: 20px 14px; }
    .asset-stack div { border: 1px solid #d9e3ef; background: white; text-align: center; padding: 16px 5px; border-radius: 6px; }
    .asset-stack strong { font-size: 13px; display: block; }
    .asset-stack small { font-size: 10px; color: var(--muted); }
    .asset-stack > span { text-align: center; color: #8da5c3; line-height: 1; }
    .road-visions { display: grid; gap: 14px; }
    .road-visions .vision-card { min-height: 112px; align-items: center; }
    .road-note { margin-top: 16px; color: #728299; font-size: 11px; }
    .principle-strip { margin-top: 26px; padding: 14px 18px; border: 1px solid #e0e8f2; border-radius: 7px; display: flex; gap: 18px; align-items: center; background: #fafcfe; font-size: 12px; color: var(--muted); }
    .principle-strip strong { color: var(--ink); white-space: nowrap; }
    .cycle-layout { display: grid; grid-template-columns: 1.8fr 1fr; gap: 32px; align-items: center; }
    .orbit { position: relative; min-width: 0; height: 510px; }
    .orbit-svg { position: absolute; width: 100%; height: 100%; inset: 0; }
    .orbit-step { position: absolute; left: var(--x); top: var(--y); transform: translate(-50%, -50%); width: 27%; max-width: 185px; padding: 13px 10px; border: 1px solid #d9e5f6; border-radius: 8px; background: white; box-shadow: 0 7px 15px -12px #2c589166; text-align: center; z-index: 1; }
    .orbit-step small { font-size: 9px; color: #91a1b8; letter-spacing: 1px; display: block; margin-bottom: 4px; }
    .orbit-step strong { display: block; font-size: 14px; }
    .orbit-step span { font-size: 10px; color: var(--blue); display: block; margin-top: 5px; }
    .orbit-center { position: absolute; left: 50%; top: 52%; transform: translate(-50%, -50%); width: 31%; background: var(--navy); color: white; border-radius: 50%; aspect-ratio: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; box-shadow: 0 15px 40px -18px #0052d980; }
    .orbit-center .icon { width: 28px; height: 28px; color: #94bbff; margin-bottom: 10px; }
    .orbit-center strong { font-size: 20px; line-height: 1.45; }
    .orbit-center small { font-size: 9px; color: #a7c0e6; letter-spacing: 1px; margin-top: 10px; }
    .cycle-notes { border-left: 1px solid var(--line); padding: 10px 0 10px 27px; }
    .cycle-notes h3 { font-size: 24px; margin: 9px 0 20px; }
    .knowledge-shift { margin: 16px 0; }
    .knowledge-shift span { display: block; font-size: 11px; color: #798ba3; }
    .knowledge-shift strong { display: block; margin-top: 3px; font-size: 15px; font-weight: 600; }
    .cycle-note { background: var(--green-soft); color: #426d60; padding: 13px 15px; border-radius: 6px; font-size: 12px; margin-top: 23px; }
    .cycle-visions { border-top: 1px solid var(--line); padding-top: 23px; }
    .story-hero { padding-bottom: 23px; border-bottom: 1px solid var(--line); }
    .story-scope { display: inline-flex; flex-wrap: wrap; gap: 10px; font-size: 11px; color: #587095; background: var(--soft); padding: 9px 14px; border-radius: 6px; margin-top: 17px; }
    .story-list { list-style: none; padding: 0; margin: 27px 0; }
    .story-step { display: grid; grid-template-columns: 34px .9fr 1.25fr; gap: 23px; position: relative; padding: 0 0 23px; }
    .story-step:not(:last-child)::before { content: ""; position: absolute; left: 16px; top: 32px; bottom: 0; width: 1px; background: #cddcf0; }
    .story-dot { width: 33px; height: 33px; border: 1px solid #c3d5ee; background: #f5f9ff; color: var(--blue); display: grid; place-items: center; border-radius: 50%; font-size: 11px; font-weight: 700; z-index: 1; }
    .story-copy { padding-top: 2px; }
    .story-copy h3 { font-size: 19px; margin-bottom: 7px; }
    .story-copy p { color: var(--muted); font-size: 12px; }
    .story-capability { display: inline-flex; align-items: center; gap: 6px; color: var(--blue); font-size: 11px; margin-top: 12px; }
    .story-capability .icon { width: 15px; height: 15px; }
    .story-preview { border: 1px solid #dce6f2; border-radius: 8px; overflow: hidden; background: #fbfdff; }
    .preview-bar { display: flex; justify-content: space-between; gap: 10px; color: #667c99; font-size: 10px; border-bottom: 1px solid #e4ebf5; padding: 8px 13px; background: #f4f7fb; }
    .preview-body { padding: 14px 16px; font-size: 12px; }
    .preview-body p + p { margin-top: 8px; }
    .preview-question { color: #365d96; font-weight: 600; }
    .preview-answer { color: var(--muted); }
    .evidence-tag { display: inline-block; background: #eaf1fc; color: #5275a4; border-radius: 4px; font-size: 10px; padding: 2px 7px; margin-top: 10px; }
    .diff-line { display: flex; gap: 12px; justify-content: space-between; padding: 5px 0; }
    .diff-line + .diff-line { border-top: 1px solid #e8edf5; }
    .diff-line span { color: var(--muted); }
    .diff-line strong { color: #315b98; font-weight: 500; text-align: right; }
    .insight-label { display: block; font-size: 10px; color: var(--blue); margin-bottom: 7px; letter-spacing: 1px; }
    .explorer-hero { background: var(--navy); color: white; padding: 33px 36px; border-radius: 9px; margin-bottom: 25px; display: flex; align-items: center; gap: 24px; justify-content: space-between; }
    .explorer-hero .eyebrow { color: #96bbff; }
    .explorer-hero h2 { font-size: 32px; }
    .explorer-hero p { color: #b8c8e0; margin-top: 9px; font-size: 13px; }
    .explorer-symbol { width: 85px; height: 85px; border: 1px solid #375784; border-radius: 22px; display: grid; place-items: center; flex-shrink: 0; background: #173562; transform: rotate(-7deg); }
    .explorer-symbol .icon { width: 39px; height: 39px; color: #a8c8ff; transform: rotate(7deg); }
    .explore-grid { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 13px; }
    .explore-card { grid-column: span 2; text-align: left; min-width: 0; background: white; border: 1px solid #dce6f3; border-radius: 8px; padding: 20px; color: var(--ink); transition: border-color .18s, box-shadow .18s, transform .18s; }
    .explore-card:nth-child(4), .explore-card:nth-child(5) { grid-column: span 3; }
    .explore-card:hover { transform: translateY(-3px); border-color: #6c9fec; box-shadow: 0 12px 24px -17px #3466a777; }
    .explore-card .feature-top { margin-bottom: 14px; }
    .explore-card h4 { font-size: 17px; }
    .explore-card p { color: var(--muted); font-size: 12px; margin-top: 8px; }
    .explore-card .explore-action { display: flex; align-items: center; justify-content: space-between; gap: 15px; color: var(--blue); font-size: 11px; margin-top: 19px; }
    .explore-action .icon { width: 16px; height: 16px; }
    .explore-future { margin-top: 26px; }
    button.vision-card { text-align: left; color: var(--ink); cursor: pointer; }
    button.vision-card:hover { border-color: #7199cb; background: #f7faff; }
    .vision-detail-hint { display: block; margin-top: 8px; font-size: 10px; color: #527cb6; }
    .hybrid { padding: 0; }
    .hybrid-hero { position: relative; padding: 34px 40px 30px; background: #102447; color: white; display: grid; grid-template-columns: 1.4fr .75fr; gap: 28px; overflow: hidden; }
    .hybrid-hero .eyebrow { color: #9cbdff; }
    .hybrid-hero h2 { font-size: clamp(30px, 3.1vw, 42px); margin-top: 12px; }
    .hybrid-hero h2 span { color: #9bbfff; }
    .hybrid-hero p { color: #b1c4df; font-size: 13px; margin-top: 13px; }
    .hybrid-seal { align-self: center; border-left: 1px solid #365178; padding: 8px 0 8px 29px; }
    .hybrid-seal small { color: #8ba7cf; font-size: 10px; letter-spacing: 1.5px; }
    .hybrid-seal strong { display: block; font-size: 19px; font-weight: 500; margin-top: 10px; line-height: 1.8; }
    .hybrid-body { padding: 26px 40px 22px; }
    .hybrid .feature-grid { gap: 10px; }
    .hybrid .feature-card { background: white; padding: 16px 14px; border-top-width: 1px; border-bottom: 3px solid #c5d8f6; }
    .hybrid .feature-top { margin-bottom: 12px; }
    .hybrid .feature-value { padding-top: 11px; }
    .hybrid-loop { position: relative; border: 1px solid #dbe8fb; background: #f2f7ff; border-radius: 8px; margin: 22px 0; padding: 17px 22px 14px; }
    .hybrid-loop-head { display: flex; justify-content: space-between; align-items: center; gap: 14px; margin-bottom: 13px; }
    .hybrid-loop-head strong { font-size: 13px; color: #2d527f; }
    .hybrid-loop-head span { font-size: 10px; color: #6483ac; }
    .loop-flow { display: grid; grid-template-columns: 1fr 25px 1fr 25px 1fr 25px 1fr; align-items: center; text-align: center; gap: 8px; }
    .loop-flow strong { color: var(--blue); display: block; font-size: 18px; }
    .loop-flow small { display: block; font-size: 10px; color: #6b82a1; margin-top: 3px; }
    .loop-flow > span { color: #93b1dc; font-size: 19px; }
    .loop-return { position: relative; width: 78%; margin: 12px auto 0; border: 1px solid #bad0ed; border-top: none; height: 20px; border-radius: 0 0 8px 8px; text-align: center; }
    .loop-return::before { content: ""; position: absolute; left: -4px; top: -1px; border-left: 3px solid transparent; border-right: 3px solid transparent; border-bottom: 5px solid #8aaad4; }
    .loop-return span { position: relative; top: 9px; padding: 0 10px; background: #f2f7ff; color: #6483ac; font-size: 10px; }
    .hybrid .vision-card { background: #fcfdff; padding: 15px; }
    .priority-line { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px; margin-top: 23px; padding-top: 16px; border-top: 1px solid var(--line); }
    .priority-line p { color: #556b88; font-size: 12px; }
    .priority-line p strong { color: var(--blue); }
    .priority-chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 10px; color: #71829a; }
    .priority-chips span { background: var(--soft); color: #456b9f; padding: 4px 8px; border-radius: 4px; }
    .hybrid .sheet-foot { margin-top: 17px; }
    dialog { border: 1px solid #cedbeb; border-radius: 14px; padding: 0; width: min(690px, calc(100vw - 32px)); max-height: calc(100dvh - 48px); color: var(--ink); background: white; box-shadow: 0 30px 100px #081d4666; overflow: auto; }
    dialog::backdrop { background: #10244780; backdrop-filter: blur(3px); }
    .detail-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; padding: 27px 30px 22px; background: #f5f9ff; border-bottom: 1px solid #e0e9f6; }
    .detail-head h2 { font-size: 25px; margin-top: 8px; }
    .detail-close { display: grid; place-items: center; border: 1px solid #d9e3f1; background: white; border-radius: 7px; width: 32px; height: 32px; color: #536b8c; flex-shrink: 0; }
    .detail-close .icon { width: 18px; height: 18px; }
    .detail-content { padding: 24px 30px 28px; }
    .detail-lead { color: #506785; margin-bottom: 21px; }
    .detail-row { display: grid; grid-template-columns: 84px 1fr; gap: 17px; padding: 13px 0; border-top: 1px solid #e5ebf4; font-size: 13px; }
    .detail-row dt { color: #7890b0; font-size: 11px; }
    .detail-row dd { margin: 0; color: #344e71; }
    .detail-example { margin: 17px 0; background: #f0f5fd; padding: 17px; border-radius: 7px; font-size: 13px; color: #3e618f; }
    .detail-example small { display: block; font-size: 10px; letter-spacing: 1px; color: #7b92b1; margin-bottom: 6px; }
    .detail-boundary { font-size: 12px; color: #567368; background: var(--green-soft); border-left: 3px solid #74af99; padding: 12px 15px; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
    .print-title { display: none; }
    @media (min-width: 1600px) {
      .shell { max-width: 1480px; }
      .sheet { padding: 42px 48px 28px; }
      .hybrid { padding: 0; }
      .hybrid-hero { padding: 38px 48px 33px; }
      .hybrid-body { padding: 29px 48px 25px; }
    }
    @media (max-width: 1080px) {
      .shell { padding: 22px; }
      .sheet { padding: 28px; }
      .scheme-tab { padding: 12px 10px; }
      .scheme-tab strong { font-size: 12px; }
      .scheme-tab small { font-size: 10px; }
      .feature-grid { grid-template-columns: repeat(6, minmax(0, 1fr)); }
      .feature-card { grid-column: span 2; }

    function blueprint() {
      return `<div class="sheet">
        ${hero('01 / Strategy on a page', '让经验可复用，让知识成为资产', 'DE-WBS AI 能力规划：从读懂项目数据，走向复用工程经验。', true)}
        ${sectionLine('近期落地', '利用现有 WBS 与用户提供的材料，先辅助，不代替。')}
        <div class="feature-grid">${features.map(featureCard).join('')}</div>
        <div class="bridge"><span class="bridge-title">不是添加几个 AI 按钮，而是建立知识沉淀链条</span><div class="bridge-flow"><span>数据</span><i>→</i><span>知识</span><i>→</i><span>经验</span><i>→</i><span>复用</span></div></div>
        ${sectionLine('长期愿景', '在真实数据、确认知识与权限体系成熟后，逐步延伸。')}
        <div class="vision-grid">${visions.map(vision => visionCard(vision)).join('')}</div>
        ${sheetFoot('01')}
      </div>`;
    }
    function roadmap() {
      return `<div class="sheet">
        ${hero('02 / A gradual evolution', '先让 AI 帮上忙，再让经验产生复利', '用阶段和前提定义路线，不用未经评估的日期承诺跨越。')}
        <div class="roadmap">
          <section class="epoch now"><span class="phase-label">NEAR TERM / 近期</span><h3>读懂数据，辅助工作</h3><p class="epoch-sub">不依赖大量历史样本，不改变现有业务规则。</p>
            <div class="road-list">${features.map(feature => `<article class="road-item" data-feature="${feature.id}">${icon(feature.id)}<div><h4>${esc(feature.name)}</h4><p>${esc(feature.short)}</p></div></article>`).join('')}</div>
          </section>
          <section class="epoch"><span class="phase-label">FOUNDATION / 积累</span><h3>沉淀可信资产</h3><p class="epoch-sub">这不是一次跳跃，而是持续积累。</p>
            <div class="asset-stack"><div><strong>确认的知识</strong><small>原文证据 · 适用条件</small></div><span>↓</span><div><strong>真实的结果</strong><small>执行记录 · 阶段复盘</small></div><span>↓</span><div><strong>可用的反馈</strong><small>人工纠正 · 采纳效果</small></div></div>
          </section>
          <section class="epoch later"><span class="phase-label">LONG TERM / 长期</span><h3>复用知识，辅助决策</h3><p class="epoch-sub">以数据质量、验证结果和授权体系为前提。</p>
            <div class="road-visions">${visions.map(vision => visionCard(vision)).join('')}</div><p class="road-note">从检索推荐 → 预测建议 → 经授权执行</p>
          </section>
        </div>
        <div class="principle-strip"><strong>贯穿所有阶段的边界</strong><span>AI 建议有来源 · 知识经人工确认 · 业务规则不绕过 · 正式执行可审计</span></div>
        ${sheetFoot('02')}
      </div>`;
    }
    function cycle() {
      const steps = [
        ['01 / EXECUTE','项目执行','Block · Version · Check','50%','12%'],
        ['02 / CAPTURE','采集过程数据','Materials · Comments','83%','32%'],
        ['03 / UNDERSTAND','AI 理解与提炼','材料理解 · 对比 · 简报','83%','72%'],
        ['04 / CONFIRM','人工确认沉淀','工程经验卡片','50%','91%'],
        ['05 / REUSE','检索与推荐复用','WBS 智能问答','17%','72%'],
        ['06 / IMPROVE','新项目应用反馈','纠正 · 结果 · 再沉淀','17%','32%']
      ];
      return `<div class="sheet">
        ${hero('03 / The knowledge flywheel', '让每次执行，都回到知识资产中', '经验不止被记录，还要被确认、找到、应用，并在实践中更新。')}
        <div class="cycle-layout">
          <div class="orbit" aria-label="项目执行、采集数据、AI提炼、人工确认、检索复用、新项目反馈的六步循环">
            <svg class="orbit-svg" viewBox="0 0 800 540" preserveAspectRatio="none" aria-hidden="true">
              <defs><marker id="cycleArrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 6 3 0 6" fill="none" stroke="#8eadd6" stroke-width="1.4"/></marker></defs>
              <ellipse cx="400" cy="278" rx="257" ry="211" fill="#f6f9fe" stroke="#dce7f6" stroke-width="1"/>
              <g fill="none" stroke="#a9c3e6" stroke-width="1.7" marker-end="url(#cycleArrow)">
                <path d="M452 72Q572 83 637 151"/><path d="M677 220Q700 280 677 333"/><path d="M633 432Q567 486 486 491"/>
                <path d="M324 491Q219 480 163 427"/><path d="M126 339Q104 280 126 221"/><path d="M166 148Q238 82 315 73"/>
              </g>
            </svg>
            <div class="orbit-center">${icon('knowledge')}<strong>工程<br>知识资产</strong><small>REUSABLE KNOWLEDGE</small></div>
            ${steps.map(step => `<div class="orbit-step" style="--x:${step[3]};--y:${step[4]}"><small>${step[0]}</small><strong>${step[1]}</strong><span>${step[2]}</span></div>`).join('')}
          </div>
          <aside class="cycle-notes"><span class="eyebrow">The real value</span><h3>不只是保存资料，<br>而是形成组织能力。</h3>
            <div class="knowledge-shift"><span>FROM / 分散的文档</span><strong>→ 带出处的知识条目</strong></div>
            <div class="knowledge-shift"><span>FROM / 一次性的处理经验</span><strong>→ 有适用条件的经验卡片</strong></div>
            <div class="knowledge-shift"><span>FROM / 依赖个人记忆</span><strong>→ 团队可查找、可复用</strong></div>
            <div class="cycle-note">AI 提炼不等于事实确认。知识归档需人工确认，并保留来源、权限与有效性。</div>
          </aside>
        </div>
        <section class="cycle-visions">${sectionLine('循环持续运转后', '走向三个长期能力方向')}<div class="vision-grid">${visions.map(vision => visionCard(vision)).join('')}</div></section>
        ${sheetFoot('03')}
      </div>`;
    }
    function story() {
      const steps = [
        {feature:'query', title:'接手时，先看清上下文', text:'不用逐张筛表。用一句问题找到当前状态、Owner 和未完成检查。',
          preview:'<p class="preview-question">“这个 Block 还有哪些 Check 没完成？”</p><p class="preview-answer">按当前 Project / WBS / Version 查询，并返回对应记录；不混用其他版本。</p><span class="evidence-tag">输出：查询结果 + 精确记录引用</span>'},
        {feature:'material', title:'读材料时，抓住关键结论', text:'把附件和 Comments 中的约束、Review 结论与待办整理出来。',
          preview:'<span class="insight-label">材料摘要 · 结构示意</span><div class="diff-line"><span>设计约束</span><strong>提取原文，注明出处</strong></div><div class="diff-line"><span>Review 待办</span><strong>列出责任与待确认事项</strong></div><div class="diff-line"><span>缺失信息</span><strong>明确标为待补充</strong></div>'},
        {feature:'version', title:'升级 Version 时，少遗漏', text:'看清已有版本的字段与材料差异，辅助安排复查。',
          preview:'<span class="insight-label">1st → 2nd · 对比结构示意</span><div class="diff-line"><span>字段 / 日期</span><strong>展示已有值的差异</strong></div><div class="diff-line"><span>Check item</span><strong>对比记录，不自动勾选</strong></div><div class="diff-line"><span>变更原因</span><strong>没有记录则不编造</strong></div>'},
        {feature:'brief', title:'推进时，让沟通更聚焦', text:'把已发生 Delay、父子 Check 阻塞和关键变化整理为跟进简报。',
          preview:'<span class="insight-label">项目简报 · 输出结构示意</span><p class="preview-answer">当前范围 / 已发生 Delay / Check 阻塞 / 关键变化 / 待跟进事项</p><span class="evidence-tag">每条结论可回到对应 WBS 记录</span>'},
        {feature:'card', title:'完成后，留下下一次能用的经验', text:'从已解决问题中提炼经验卡片，经人工确认后供相似场景检索。',
          preview:'<span class="insight-label">经验卡片 · 待人工确认</span><p class="preview-answer">问题 → 处理方法 → 已确认结果 → 适用条件 → 证据出处</p><span class="evidence-tag">不是项目结束即遗忘，而是归档后复用</span>'}
      ];
      return `<div class="sheet">
        <header class="story-hero"><div class="eyebrow">04 / A Block's journey</div><h2>一个 Block 的工作，<br>成为下一个 Block 的经验。</h2><p class="hero-copy">从工程师的五个工作时刻，理解 AI 的实际价值。</p><div class="story-scope"><strong>场景示意，非实时业务数据</strong><span>Project → WBS → CORE_ARRAY → Version</span></div></header>
        <ol class="story-list">${steps.map((step, index) => `<li class="story-step" data-feature="${step.feature}"><span class="story-dot">0${index + 1}</span><div class="story-copy"><h3>${step.title}</h3><p>${step.text}</p><span class="story-capability">${icon(step.feature)}${esc(features[index].name)}</span></div><div class="story-preview"><div class="preview-bar"><span>DE-WBS AI · 使用方式示意</span><span>规划能力</span></div><div class="preview-body">${step.preview}</div></div></li>`).join('')}</ol>
        ${sectionLine('当越来越多 Block 留下经验', '从个人辅助，逐步走向组织级能力。')}
        <div class="vision-grid">${visions.map(vision => visionCard(vision)).join('')}</div>
        ${sheetFoot('04')}
      </div>`;
    }
    function interactive() {
      return `<div class="sheet">
        <header class="explorer-hero"><div><div class="eyebrow">05 / Explore the capabilities</div><h2>先看到价值，再展开细节。</h2><p>点击卡片，查看使用数据、AI 产出、沉淀资产与能力边界。</p></div><div class="explorer-symbol">${icon('interactive')}</div></header>
        ${sectionLine('5 个近期功能', '可点击 · 支持键盘 Tab / Enter 操作')}
        <div class="explore-grid">${features.map((feature, index) => `<button class="explore-card" type="button" data-detail="${feature.id}" data-feature="${feature.id}" aria-haspopup="dialog"><div class="feature-top">${icon(feature.id)}<span class="feature-index">0${index + 1} / 近期</span></div><h4>${esc(feature.name)}</h4><p>${esc(feature.short)}</p><span class="explore-action"><span>${esc(feature.value)}</span>${icon('arrow')}</span></button>`).join('')}</div>
        <section class="explore-future">${sectionLine('3 个长期愿景', '点击查看前提，不把愿景当成上线承诺。')}<div class="vision-grid">${visions.map(vision => visionCard(vision, true)).join('')}</div></section>
        ${sheetFoot('05')}
      </div>`;
    }
    function hybrid() {
      return `<div class="sheet hybrid">
        <header class="hybrid-hero"><div><div class="eyebrow">06 / Recommended concept</div><h2>让项目留下知识，<br><span>让经验进入下一次设计。</span></h2><p>DE-WBS AI Knowledge Copilot · 近期可落地，长期可积累。</p></div><div class="hybrid-seal"><small>OUR PRODUCT PHILOSOPHY</small><strong>让经验可复用<br>让知识成为资产<br>让数据持续创造价值</strong></div></header>
        <div class="hybrid-body">
          ${sectionLine('第一步 · 让当前工作更高效', '5 个近期功能 / 基于已有 WBS 与用户提供的材料')}
          <div class="feature-grid">${features.map(featureCard).join('')}</div>
          <section class="hybrid-loop" aria-label="数据到知识、经验、复用，再回到项目结果的循环">
            <div class="hybrid-loop-head"><strong>贯穿所有能力：知识资产闭环</strong><span>原文可追溯 · 人工确认 · 受控存储</span></div>
            <div class="loop-flow"><div><strong>数据</strong><small>WBS · 材料 · 记录</small></div><span>→</span><div><strong>知识</strong><small>理解 · 提取 · 关联</small></div><span>→</span><div><strong>经验</strong><small>确认 · 条件 · 案例</small></div><span>→</span><div><strong>复用</strong><small>查找 · 推荐 · 应用</small></div></div>
            <div class="loop-return"><span>新项目结果与人工反馈，持续回流</span></div>
          </section>
          ${sectionLine('下一步 · 让组织经验持续增值', '3 个长期愿景 / 数据、评估与授权成熟后逐步实现')}
          <div class="vision-grid">${visions.map(vision => visionCard(vision)).join('')}</div>
          <div class="priority-line"><p>优先组合：<strong>材料理解 + 经验卡片 + 智能问答</strong></p><div class="priority-chips">先跑通知识复用闭环<span>沉淀</span><span>确认</span><span>找到</span><span>使用</span></div></div>
          ${sheetFoot('06')}
        </div>
      </div>`;
    }
    const tabs = document.getElementById('schemeTabs');
    const panels = document.getElementById('presentations');
    const renderers = [blueprint, roadmap, cycle, story, interactive, hybrid];
    tabs.innerHTML = schemes.map((scheme, index) => `<button type="button" role="tab" id="tab-${index + 1}" aria-controls="scheme-${index + 1}" aria-selected="false" tabindex="-1" class="scheme-tab" data-scheme="${index + 1}">${index === 5 ? '<span class="recommend-badge">推荐</span>' : ''}<span class="tab-meta"><span class="tab-number">0${index + 1}</span>${icon(scheme.icon)}</span><strong>${esc(scheme.name)}</strong><small>${esc(scheme.caption)}</small></button>`).join('');
    panels.innerHTML = renderers.map((render, index) => `<section class="presentation" role="tabpanel" tabindex="0" id="scheme-${index + 1}" aria-labelledby="tab-${index + 1}" hidden>${render()}</section>`).join('');
    document.querySelectorAll('[data-icon]').forEach(element => { element.innerHTML = icon(element.dataset.icon); });
    let currentScheme = 1;
    function selectScheme(number, focusTab = false) {
      if (!Number.isInteger(number) || number < 1 || number > schemes.length) return;
      currentScheme = number;
      document.querySelectorAll('[data-scheme]').forEach(tab => {
        const selected = Number(tab.dataset.scheme) === number;
        tab.setAttribute('aria-selected', String(selected));
        tab.tabIndex = selected ? 0 : -1;
      });
      document.querySelectorAll('.presentation').forEach((panel, index) => { panel.hidden = index + 1 !== number; });
      const scheme = schemes[number - 1];
      document.getElementById('schemeUse').textContent = scheme.use;
      document.getElementById('schemeDescription').textContent = scheme.description;
      document.getElementById('schemeCount').textContent = `0${number} / 06`;
      document.getElementById('printTitle').textContent = `DE-WBS AI 规划 · 方案 0${number} · ${scheme.name}`;
      document.getElementById('viewStatus').textContent = `已展示方案 ${number}：${scheme.name}`;
      document.title = `方案 ${number} · ${scheme.name} | DE-WBS AI 规划`;
      if (location.hash !== `#view-${number}`) history.replaceState(null, '', `#view-${number}`);
      if (focusTab) document.getElementById(`tab-${number}`).focus({preventScroll: true});
    }
    tabs.addEventListener('click', event => {
      const tab = event.target.closest('[data-scheme]');
      if (tab) selectScheme(Number(tab.dataset.scheme));
    });
    tabs.addEventListener('keydown', event => {
      const tab = event.target.closest('[data-scheme]');
      if (!tab) return;
      let number = Number(tab.dataset.scheme);
      if (event.key === 'ArrowRight') number = number % schemes.length + 1;
      else if (event.key === 'ArrowLeft') number = (number + schemes.length - 2) % schemes.length + 1;
      else if (event.key === 'Home') number = 1;
      else if (event.key === 'End') number = schemes.length;
      else return;
      event.preventDefault();
      selectScheme(number, true);
    });
    function navigateScheme(number) {
      selectScheme(number, true);
      tabs.scrollIntoView({block: 'start'});
    }
    document.getElementById('previousButton').addEventListener('click', () => navigateScheme((currentScheme + schemes.length - 2) % schemes.length + 1));
    document.getElementById('nextButton').addEventListener('click', () => navigateScheme(currentScheme % schemes.length + 1));
    document.getElementById('recommendedButton').addEventListener('click', () => navigateScheme(6));
    document.getElementById('printButton').addEventListener('click', () => window.print());
    const dialog = document.getElementById('detailDialog');
    panels.addEventListener('click', event => {
      const button = event.target.closest('[data-detail]');
      if (!button) return;
      const record = [...features, ...visions].find(item => item.id === button.dataset.detail);
      if (!record) return;
      const isNearTerm = features.includes(record);
      document.getElementById('detailPhase').textContent = isNearTerm ? 'NEAR TERM / 近期功能 · 规划建议' : 'LONG TERM / 长期愿景 · 规划建议';
      document.getElementById('detailTitle').textContent = record.name;
      document.getElementById('detailContent').innerHTML = `<p class="detail-lead">${esc(record.short)}</p><dl>
        <div class="detail-row"><dt>使用数据</dt><dd>${esc(record.input)}</dd></div>
        <div class="detail-row"><dt>AI 产出</dt><dd>${esc(record.output)}</dd></div>
        <div class="detail-row"><dt>沉淀资产</dt><dd>${esc(record.asset)}</dd></div></dl>
        <div class="detail-example"><small>使用示例 · 非模型实时输出</small>${esc(record.example)}</div>
        <div class="detail-boundary"><strong>能力边界 / </strong>${esc(record.boundary)}</div>`;
      dialog.showModal();
    });
    document.getElementById('closeDetail').addEventListener('click', () => dialog.close());
    dialog.addEventListener('click', event => { if (event.target === dialog) dialog.close(); });
    dialog.addEventListener('keydown', event => {
      if (event.key === 'Escape') {
        event.preventDefault();
        dialog.close();
      }
    });
    function restoreSchemeFromHash() {
      const match = /^#view-([1-6])$/.exec(location.hash);
      selectScheme(match ? Number(match[1]) : 1);
    }
    window.addEventListener('hashchange', restoreSchemeFromHash);
    restoreSchemeFromHash();
  </script>
</body>
</html>
